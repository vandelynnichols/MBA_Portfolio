<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560"><rect width="900" height="560" fill="white"/><text x="45" y="45" font-family="Arial,sans-serif" font-size="25">Published Clinical and Operational Outcomes Associated with Early Peptide-Based Enteral Nutrition</text><g font-family="Arial,sans-serif" font-size="18"><text x="65" y="120">Feeding intolerance</text><text x="310" y="120">30.5–65.7%</text><text x="65" y="190">Acute GI injury</text><text x="310" y="190">40%</text><text x="65" y="260">ICU LOS reduction</text><text x="310" y="260">2.23 days</text><text x="65" y="330">Hospital LOS reduction</text><text x="310" y="330">1.85 days</text><text x="65" y="400">Faster time to nutrition goal</text><text x="310" y="400">0.33 days</text></g><g fill="#777"><rect x="500" y="95" width="250" height="35"/><rect x="500" y="165" width="153" height="35"/><rect x="500" y="235" width="215" height="35"/><rect x="500" y="305" width="178" height="35"/><rect x="500" y="375" width="95" height="35"/></g></svg>